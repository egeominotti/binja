name: Scheduled stability

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: scheduled-stability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  model-campaign:
    name: Extended model campaign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINJA_MODEL_RUNS: 1000
      BINJA_MODEL_COMMANDS: 100
      BINJA_CROSS_ENV_RUNS: 500
      BINJA_CROSS_ENV_COMMANDS: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run extended model-based tests
        run: bun test test/model-based --randomize --dots

      - name: Run sustained concurrency tests
        run: bun run test:soak

      - name: Repeat the full suite
        run: bun test --rerun-each=5 --randomize --dots
