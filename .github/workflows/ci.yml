name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint and format check
        run: bun run check

      - name: Run tests with coverage gates
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Test packed npm artifact
        run: bun run test:package

  compatibility:
    name: Compatibility (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu / minimum
            os: ubuntu-latest
            bun-version: 1.3.14
          - label: Ubuntu / latest
            os: ubuntu-latest
            bun-version: latest
          - label: macOS / minimum
            os: macos-latest
            bun-version: 1.3.14
          - label: macOS / latest
            os: macos-latest
            bun-version: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run randomized tests
        run: bun test --randomize --dots

  stability:
    name: Stability
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repeat the full suite in randomized order
        run: bun run test:stress

      - name: Run sustained concurrency tests
        run: bun run test:soak
