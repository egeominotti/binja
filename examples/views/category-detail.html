<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }} - {{ siteName }}</title>
</head>
<body>
  <h1>{{ category.name }}</h1>
  {% for post in posts %}
    <p><a href="/blog/{{ post.id }}">{{ post.title }}</a></p>
  {% else %}
    <p>No posts in this category.</p>
  {% endfor %}
</body>
</html>
